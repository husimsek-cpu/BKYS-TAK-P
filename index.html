<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ürün Takip Uygulaması</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <header>
        <h1>Ürün Takip Uygulaması</h1>
        <p>Ürün ekle, stok güncelle ve kritik stokları takip et.</p>
      </header>

      <section class="panel">
        <h2>Yeni Ürün</h2>
        <form id="productForm" class="form-grid">
          <label>
            Ürün Adı
            <input id="name" required placeholder="Örn: Kablosuz Mouse" />
          </label>
          <label>
            SKU
            <input id="sku" required placeholder="Örn: MSE-100" />
          </label>
          <label>
            Kategori
            <input id="category" required placeholder="Örn: Aksesuar" />
          </label>
          <label>
            Stok
            <input id="stock" type="number" min="0" required value="0" />
          </label>
          <label>
            Minimum Stok
            <input id="minStock" type="number" min="0" required value="5" />
          </label>
          <button type="submit">Ürün Ekle</button>
        </form>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>Ürün Listesi</h2>
          <div class="kpi" id="kpi">Toplam ürün: 0</div>
        </div>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Ürün</th>
                <th>SKU</th>
                <th>Kategori</th>
                <th>Stok</th>
                <th>Min</th>
                <th>Durum</th>
                <th>İşlemler</th>
              </tr>
            </thead>
            <tbody id="productBody"></tbody>
          </table>
        </div>
      </section>
    </main>

    <template id="rowTemplate">
      <tr>
        <td class="name"></td>
        <td class="sku"></td>
        <td class="category"></td>
        <td class="stock"></td>
        <td class="min-stock"></td>
        <td><span class="badge status"></span></td>
        <td>
          <button class="small decrement">-1</button>
          <button class="small increment">+1</button>
          <button class="small danger delete">Sil</button>
        </td>
      </tr>
    </template>

    <script src="app.js"></script>
  </body>
</html>
